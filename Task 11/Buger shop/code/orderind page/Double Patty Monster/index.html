<!DOCTYPE html>
<html lang="en">

          <head>
                    <link rel="shortcut icon" href="../img/brand.png" type="image/x-icon">
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>BBQ Chicken Burger</title>
                    <link rel="stylesheet" href="style.css">
                    <link rel="stylesheet" href="../top bar style sheet.css">


          <body>
                    <header>
                              <nav>
                                        <img id="logo" src="../img/logo.webp" alt="logo">
                                        <ul>
                                                  <li><a href="https://buger-shop-six.vercel.app/">home</a></li>
                                                  <li><a href="https://buger-shop-six.vercel.app/Ordering%20meanu/index.html">menu</a>
                                                  </li>
                                                  <li><a href="https://buger-shop-six.vercel.app/About%20Us/index.html">about</a>
                                                  </li>
                                                  <li><a href="https://buger-shop-six.vercel.app/login%20page/index.html">login</a>
                                                  </li>

                                        </ul>
                              <button id="themeBtn"><img id="themeIcon" src="../img/moon.png" alt=""></button>

                              </nav>
                    </header>
                    <main>
                              <div id="main_container">
                                        <div class="child1" id="bcontainer">

                                        </div>
                                        <div class="child2">
                                                  <h1>BBQ <span>Chicken Burger</span></h1>
                                                  <p>Juicy grilled beef patty layered with fresh lettuce,<br> tomatoes,
                                                            melted cheese, and our signature Travel <br>sauce.</p>
                                                  <h3 id="productPrice">₹199</h3>
                                                  <div id="product_quantity">
                                                            <button id="incrementBtn" class="quantity_button">-</button>
                                                            <h5 id="productQuantity">1</h5>
                                                            <button id="decrementBtn" class="quantity_button">+</button>
                                                            <button id="deleteBtn" class="quantity_button"><img
                                                                                src="../img/Bin.png" id="img"
                                                                                alt=""></button>
                                                  </div>
                                                  <div id="productItems"><label id="labelC" class="check_box"
                                                                      for="chess">chess</label>
                                                            <input class="check_box" type="checkbox" id="chess">

                                                            <label id="labelO" class="check_box"
                                                                      for="onions">onions</label>
                                                            <input class="check_box" type="checkbox" id="onions">

                                                            <label id="labelT" class="check_box"
                                                                      for="tomatoes">tomato</label>
                                                            <input class="check_box" type="checkbox" id="tomatoes">

                                                            <label id="labelL" class="check_box"
                                                                      for="lettuce">lettuce</label>
                                                            <input class="check_box" type="checkbox" id="lettuce">

                                                            <label id="labelS" class="check_box"
                                                                      for="ketchup">ketchup</label>
                                                            <input class="check_box" type="checkbox" id="ketchup">

                                                  </div>
                                                  <div id="button_container">
                                                            <button class="button" id="b1">Add to Card</button>
                                                            <button class="button" id="b2">Buy Now</button>
                                                  </div>

                                        </div>
                              </div>
                    </main>
                    <script src="app.js"></script>
          </body>

</html>
