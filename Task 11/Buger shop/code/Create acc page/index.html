<!DOCTYPE html>
<html lang="en">

          <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Create Account</title>
                    <link rel="stylesheet" href="style.css">
                    <link rel="shortcut icon" href="../img/brand.png" type="image/x-icon">
          </head>

          <body>
                    <header>
                              <nav>
                                        <img id="logo" src="../img/logo.webp" alt="logo">
                                        <ul>
                                                  <li><a href="https://buger-shop-six.vercel.app/">home</a></li>
                                                  <li><a href="https://buger-shop-six.vercel.app/Ordering%20meanu/index.html">menu</a>
                                                  </li>
                                                  <li><a href="https://buger-shop-six.vercel.app/About%20Us/index.html">about</a>
                                                  </li>
                                                  <li><a href="https://buger-shop-six.vercel.app/login%20page/index.html">login</a>
                                                  </li>
                                        </ul>

                                        <button id="themeBtn"><img id="themeIcon" src="../img/moon.png" alt=""></button>
                              </nav>
                    </header>
                    <main>
                              <div id="main_container">
                                        <h1>Create <span> Account</span></h1><br>

                                        <input class="input" id="userName" placeholder="Full Name" type="text"><br>
                                        <input class="input" id="userEmail" placeholder="Email" type="email"><br>
                                        <div class="passContainer">
                                                  <input class="passinput" id="userPassword" placeholder="Password"
                                                            type="password">
                                                  <button class="passBtn" id="passBtn"><img src="../img/visible.png"
                                                                      id="passVisible" alt=""><img
                                                                      src="../img/invisible.png" id="passInVisible"
                                                                      alt="">
                                                  </button>
                                        </div>
                                        <div class="passContainer">
                                                  <input class="passinput" id="userConformPassword"
                                                            placeholder="Conform Password" type="password">
                                                  <button class="passBtn" id="passCBtn">
                                                            <img src="../img/visible.png" id="passCVisible" alt="">
                                                            <img src="../img/invisible.png" id="passCInVisible" alt="">
                                                  </button>
                                        </div>
                                        <button id="createBtn">Create</button><br>
                                        <a href="../login page/index.html" id="loginPage">Login</a>
                              </div>
                    </main>
                    <script src="app.js"></script>
          </body>

</html>
